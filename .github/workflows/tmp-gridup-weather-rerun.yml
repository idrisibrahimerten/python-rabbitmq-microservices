name: Temporary GridUp Weather Export Rerun

on:
  push:
    branches:
      - tmp-gridup-weather-20260825
    paths:
      - .github/workflows/tmp-gridup-weather-rerun.yml

permissions:
  contents: write

jobs:
  export-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-gridup-weather-20260825

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pandas

      - name: Extract and run weather fetch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tmp-gridup-weather.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = next(i for i, x in enumerate(lines) if x.strip() == '- name: Fetch district-level historical weather')
          run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].strip() == '- name: Upload weather artifact')
          script_lines = lines[run_line + 1:end]
          indent = min(len(x) - len(x.lstrip()) for x in script_lines if x.strip())
          script = '\n'.join(x[indent:] if len(x) >= indent else '' for x in script_lines) + '\n'
          Path('/tmp/fetch_gridup_weather.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/fetch_gridup_weather.sh

      - name: Upload weather artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridup-weather-district-daily
          path: tmp_gridup_weather/
          retention-days: 3

      - name: Commit temporary weather output to branch
        shell: bash
        run: |
          git config user.name "gridup-weather-bot"
          git config user.email "gridup-weather-bot@users.noreply.github.com"
          git add tmp_gridup_weather
          git commit -m "[weather-output] export temporary GridUp weather data"
          git push origin HEAD:tmp-gridup-weather-20260825
