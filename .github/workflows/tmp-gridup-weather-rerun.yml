name: Temporary GridUp Weather Export Rerun

on:
  push:
    branches:
      - tmp-gridup-weather-20260825
    paths:
      - .github/workflows/tmp-gridup-weather-rerun.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  export-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-gridup-weather-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet pandas requests
      - name: Fetch realised district weather in a single batched request
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          import requests

          points=[
          ('MANİSA>AHMETLİ',38.519,27.938),('MANİSA>AKHİSAR',38.918,27.840),('MANİSA>ALAŞEHİR',38.350,28.517),('MANİSA>DEMİRCİ',39.046,28.659),('MANİSA>GÖLMARMARA',38.713,27.914),('MANİSA>GÖRDES',38.932,28.290),('MANİSA>KIRKAĞAÇ',39.106,27.669),('MANİSA>KULA',38.548,28.649),('MANİSA>KÖPRÜBAŞI',38.749,28.404),('MANİSA>SALİHLİ',38.482,28.139),('MANİSA>SARIGÖL',38.239,28.697),('MANİSA>SARUHANLI',38.734,27.568),('MANİSA>SELENDİ',38.744,28.867),('MANİSA>SOMA',39.185,27.609),('MANİSA>TURGUTLU',38.500,27.705),('MANİSA>YUNUSEMRE',38.608,27.418),('MANİSA>ŞEHZADELER',38.613,27.430),
          ('İZMİR>GÜNEY BÖLGE>BAYINDIR',38.217,27.648),('İZMİR>GÜNEY BÖLGE>BEYDAĞ',38.086,28.205),('İZMİR>GÜNEY BÖLGE>KARABURUN',38.637,26.511),('İZMİR>GÜNEY BÖLGE>KEMALPAŞA',38.427,27.417),('İZMİR>GÜNEY BÖLGE>KİRAZ',38.231,28.204),('İZMİR>GÜNEY BÖLGE>MENDERES',38.254,27.134),('İZMİR>GÜNEY BÖLGE>SEFERİHİSAR',38.197,26.839),('İZMİR>GÜNEY BÖLGE>SELÇUK',37.949,27.370),('İZMİR>GÜNEY BÖLGE>TORBALI',38.161,27.358),('İZMİR>GÜNEY BÖLGE>TİRE',38.089,27.735),('İZMİR>GÜNEY BÖLGE>URLA',38.322,26.764),('İZMİR>GÜNEY BÖLGE>ÇEŞME',38.324,26.303),('İZMİR>GÜNEY BÖLGE>ÖDEMİŞ',38.228,27.972),('İZMİR>KUZEY BÖLGE>ALİAĞA',38.800,26.972),('İZMİR>KUZEY BÖLGE>BERGAMA',39.121,27.180),('İZMİR>KUZEY BÖLGE>DİKİLİ',39.072,26.889),('İZMİR>KUZEY BÖLGE>FOÇA',38.670,26.756),('İZMİR>KUZEY BÖLGE>KINIK',39.087,27.383),('İZMİR>KUZEY BÖLGE>MENEMEN',38.607,27.069),('İZMİR>METROPOL>BALÇOVA',38.393,27.050),('İZMİR>METROPOL>BAYRAKLI',38.462,27.166),('İZMİR>METROPOL>BORNOVA',38.466,27.221),('İZMİR>METROPOL>BUCA',38.387,27.174),('İZMİR>METROPOL>GAZİEMİR',38.322,27.128),('İZMİR>METROPOL>GÜZELBAHÇE',38.370,26.881),('İZMİR>METROPOL>KARABAĞLAR',38.369,27.126),('İZMİR>METROPOL>KARŞIYAKA',38.456,27.114),('İZMİR>METROPOL>KONAK',38.419,27.128),('İZMİR>METROPOL>NARLIDERE',38.394,27.001),('İZMİR>METROPOL>ÇİĞLİ',38.493,27.053)]
          variables=['temperature_2m_mean','temperature_2m_min','temperature_2m_max','apparent_temperature_mean','relative_humidity_2m_mean','precipitation_sum','rain_sum','precipitation_hours','wind_speed_10m_mean','wind_speed_10m_max','wind_gusts_10m_max','shortwave_radiation_sum','sunshine_duration','daylight_duration','et0_fao_evapotranspiration']
          endpoint='https://archive-api.open-meteo.com/v1/archive'
          params={'latitude':','.join(f'{lat:.3f}' for _,lat,lon in points),'longitude':','.join(f'{lon:.3f}' for _,lat,lon in points),'start_date':'2025-01-01','end_date':'2026-07-31','daily':','.join(variables),'timezone':'Europe/Istanbul','models':'era5_seamless','cell_selection':'land'}
          r=requests.get(endpoint,params=params,timeout=600)
          print('status',r.status_code,'bytes',len(r.content),'url_length',len(r.url),flush=True)
          if r.status_code!=200:
              print(r.text[:5000],flush=True)
              r.raise_for_status()
          payload=r.json()
          if not isinstance(payload,list) or len(payload)!=len(points):
              raise RuntimeError(f'Expected {len(points)} locations, got {type(payload)} / {len(payload) if isinstance(payload,list) else "n/a"}')
          out=Path('tmp_gridup_weather_fast');out.mkdir(exist_ok=True)
          frames=[];meta=[]
          for location_id,((location,lat,lon),obj) in enumerate(zip(points,payload)):
              d=pd.DataFrame(obj['daily'])
              if len(d)!=577: raise RuntimeError(f'{location}: expected 577 days, got {len(d)}')
              d.rename(columns={'time':'tarih'},inplace=True)
              d.insert(0,'lokasyon',location);d.insert(1,'location_id',location_id)
              d['latitude_requested']=lat;d['longitude_requested']=lon;d['latitude_grid']=obj.get('latitude');d['longitude_grid']=obj.get('longitude');d['elevation']=obj.get('elevation');d['weather_source']='Open-Meteo ERA5-Seamless historical reanalysis'
              frames.append(d)
              meta.append({'location_id':location_id,'lokasyon':location,'latitude_requested':lat,'longitude_requested':lon,'latitude_grid':obj.get('latitude'),'longitude_grid':obj.get('longitude'),'elevation':obj.get('elevation')})
          weather=pd.concat(frames,ignore_index=True).sort_values(['lokasyon','tarih'])
          assert len(weather)==47*577 and weather[['lokasyon','tarih']].duplicated().sum()==0
          csv_path=out/'weather_district_daily_2025-01-01_2026-07-31.csv'
          weather.to_csv(csv_path,index=False)
          pd.DataFrame(meta).to_csv(out/'district_weather_grid_metadata.csv',index=False)
          manifest={'source':'Open-Meteo ERA5-Seamless historical reanalysis','endpoint':endpoint,'period':{'start':'2025-01-01','end':'2026-07-31','days_per_location':577},'locations':47,'rows':int(len(weather)),'variables':variables,'missing_by_column':{c:int(v) for c,v in weather.isna().sum().items()},'license':'CC BY 4.0; attribution required','csv_sha256':hashlib.sha256(csv_path.read_bytes()).hexdigest()}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Upload weather artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridup-weather-fast-real
          path: tmp_gridup_weather_fast/
          retention-days: 3
      - name: Commit temporary weather output to branch
        shell: bash
        run: |
          git config user.name "gridup-weather-bot"
          git config user.email "gridup-weather-bot@users.noreply.github.com"
          git add tmp_gridup_weather_fast
          git commit -m "[weather-output] add fast ERA5-Seamless batch export"
          git push origin HEAD:tmp-gridup-weather-20260825
