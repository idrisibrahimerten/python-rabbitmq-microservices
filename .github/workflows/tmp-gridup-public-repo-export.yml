name: Temporary GridUp Public Repo Export

on:
  push:
    branches:
      - tmp-gridup-weather-20260825
    paths:
      - .github/workflows/tmp-gridup-public-repo-export.yml

permissions:
  contents: read

jobs:
  export-public-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-gridup-weather-20260825
      - name: Clone and archive public research repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ckproduces/grid-up-datathon.git /tmp/gridup-public
          rm -rf /tmp/gridup-public/.git
          tar -C /tmp -czf gridup_public_repo.tar.gz gridup-public
          ls -lh gridup_public_repo.tar.gz
      - name: Upload public-repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridup-public-repo
          path: gridup_public_repo.tar.gz
          retention-days: 3
