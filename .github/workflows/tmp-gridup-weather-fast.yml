name: Temporary GridUp Weather Fast Export

on:
  push:
    branches: [tmp-gridup-weather-20260825]
    paths: [.github/workflows/tmp-gridup-weather-fast.yml]

permissions:
  contents: write

jobs:
  export-weather-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-gridup-weather-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet requests pandas
      - name: Fetch real district weather in batches
        shell: bash
        run: |
          cat > /tmp/fetch_gridup_weather.py <<'PY'
          import json, time
          from pathlib import Path
          import pandas as pd
          import requests

          START='2025-01-01'; END='2026-07-31'
          OUT=Path('tmp_gridup_weather_fast'); OUT.mkdir(exist_ok=True)
          COORDS=[
          ('MANİSA>AHMETLİ',38.519,27.938),('MANİSA>AKHİSAR',38.918,27.840),('MANİSA>ALAŞEHİR',38.350,28.517),('MANİSA>DEMİRCİ',39.046,28.659),('MANİSA>GÖLMARMARA',38.713,27.914),('MANİSA>GÖRDES',38.932,28.290),('MANİSA>KIRKAĞAÇ',39.106,27.669),('MANİSA>KULA',38.548,28.649),('MANİSA>KÖPRÜBAŞI',38.749,28.404),('MANİSA>SALİHLİ',38.482,28.139),('MANİSA>SARIGÖL',38.239,28.697),('MANİSA>SARUHANLI',38.734,27.568),('MANİSA>SELENDİ',38.744,28.867),('MANİSA>SOMA',39.185,27.609),('MANİSA>TURGUTLU',38.500,27.705),('MANİSA>YUNUSEMRE',38.608,27.418),('MANİSA>ŞEHZADELER',38.613,27.430),
          ('İZMİR>GÜNEY BÖLGE>BAYINDIR',38.217,27.648),('İZMİR>GÜNEY BÖLGE>BEYDAĞ',38.086,28.205),('İZMİR>GÜNEY BÖLGE>KARABURUN',38.637,26.511),('İZMİR>GÜNEY BÖLGE>KEMALPAŞA',38.427,27.417),('İZMİR>GÜNEY BÖLGE>KİRAZ',38.231,28.204),('İZMİR>GÜNEY BÖLGE>MENDERES',38.254,27.134),('İZMİR>GÜNEY BÖLGE>SEFERİHİSAR',38.197,26.839),('İZMİR>GÜNEY BÖLGE>SELÇUK',37.949,27.370),('İZMİR>GÜNEY BÖLGE>TORBALI',38.161,27.358),('İZMİR>GÜNEY BÖLGE>TİRE',38.089,27.735),('İZMİR>GÜNEY BÖLGE>URLA',38.322,26.764),('İZMİR>GÜNEY BÖLGE>ÇEŞME',38.324,26.303),('İZMİR>GÜNEY BÖLGE>ÖDEMİŞ',38.228,27.972),
          ('İZMİR>KUZEY BÖLGE>ALİAĞA',38.800,26.972),('İZMİR>KUZEY BÖLGE>BERGAMA',39.121,27.180),('İZMİR>KUZEY BÖLGE>DİKİLİ',39.072,26.889),('İZMİR>KUZEY BÖLGE>FOÇA',38.670,26.756),('İZMİR>KUZEY BÖLGE>KINIK',39.087,27.383),('İZMİR>KUZEY BÖLGE>MENEMEN',38.607,27.069),
          ('İZMİR>METROPOL>BALÇOVA',38.393,27.050),('İZMİR>METROPOL>BAYRAKLI',38.462,27.166),('İZMİR>METROPOL>BORNOVA',38.466,27.221),('İZMİR>METROPOL>BUCA',38.387,27.174),('İZMİR>METROPOL>GAZİEMİR',38.322,27.128),('İZMİR>METROPOL>GÜZELBAHÇE',38.370,26.881),('İZMİR>METROPOL>KARABAĞLAR',38.369,27.126),('İZMİR>METROPOL>KARŞIYAKA',38.456,27.114),('İZMİR>METROPOL>KONAK',38.419,27.128),('İZMİR>METROPOL>NARLIDERE',38.394,27.001),('İZMİR>METROPOL>ÇİĞLİ',38.493,27.053)]
          DAILY=['temperature_2m_mean','temperature_2m_min','temperature_2m_max','apparent_temperature_mean','apparent_temperature_min','apparent_temperature_max','precipitation_sum','rain_sum','snowfall_sum','wind_speed_10m_max','wind_gusts_10m_max','shortwave_radiation_sum','sunshine_duration','daylight_duration','et0_fao_evapotranspiration']
          S=requests.Session(); S.headers['User-Agent']='gridup-real-weather-export/1.0'
          def request_batch(batch):
              params={'latitude':','.join(str(x[1]) for x in batch),'longitude':','.join(str(x[2]) for x in batch),'start_date':START,'end_date':END,'daily':','.join(DAILY),'timezone':'Europe/Istanbul','temperature_unit':'celsius','wind_speed_unit':'kmh','precipitation_unit':'mm'}
              last=None
              for k in range(6):
                  try:
                      r=S.get('https://archive-api.open-meteo.com/v1/archive',params=params,timeout=300); r.raise_for_status(); data=r.json()
                      if isinstance(data,dict): data=[data]
                      if len(data)!=len(batch): raise RuntimeError(f'locations {len(data)} != {len(batch)}')
                      return data
                  except Exception as e:
                      last=e; print('retry',k,e,flush=True); time.sleep(2**k)
              raise RuntimeError(last)
          frames=[]
          for start in range(0,len(COORDS),8):
              batch=COORDS[start:start+8]; payload=request_batch(batch)
              for (loc,lat,lon),obj in zip(batch,payload):
                  daily=obj.get('daily') or {}
                  f=pd.DataFrame(daily)
                  if len(f)!=(pd.Timestamp(END)-pd.Timestamp(START)).days+1: raise RuntimeError(f'{loc}: bad row count {len(f)}')
                  f.insert(0,'lokasyon',loc); f.rename(columns={'time':'tarih'},inplace=True)
                  f['latitude_requested']=lat; f['longitude_requested']=lon; f['latitude_grid']=obj.get('latitude'); f['longitude_grid']=obj.get('longitude'); f['elevation']=obj.get('elevation'); f['weather_source']='Open-Meteo Historical Weather API'
                  frames.append(f)
              print('batch',start,len(frames),flush=True); time.sleep(1)
          w=pd.concat(frames,ignore_index=True).sort_values(['lokasyon','tarih'])
          assert w.lokasyon.nunique()==47
          assert w[['lokasyon','tarih']].duplicated().sum()==0
          w.to_csv(OUT/'weather_district_daily_2025-01-01_2026-07-31.csv',index=False)
          pd.DataFrame(COORDS,columns=['lokasyon','latitude','longitude']).to_csv(OUT/'district_geocodes.csv',index=False)
          manifest={'source':'Open-Meteo Historical Weather API','endpoint':'https://archive-api.open-meteo.com/v1/archive','date_start':START,'date_end':END,'districts':47,'rows':int(len(w)),'variables':DAILY,'missing_by_column':{k:int(v) for k,v in w.isna().sum().items()}}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False),flush=True)
          PY
          python /tmp/fetch_gridup_weather.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridup-weather-fast
          path: tmp_gridup_weather_fast/
          retention-days: 3
      - name: Commit output
        shell: bash
        run: |
          git config user.name gridup-weather-bot
          git config user.email gridup-weather-bot@users.noreply.github.com
          git add tmp_gridup_weather_fast
          git commit -m '[weather-output] fast real district weather export'
          git push origin HEAD:tmp-gridup-weather-20260825
